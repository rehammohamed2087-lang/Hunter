<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صيّاد الأخطاء</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff7e6;--card:#fff;--ink:#2b2d42;--pri:#ff7a59;--ok:#2bb673;--bad:#e5484d;--soft:#ffe3d6;--bar:#f0e2c8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e2033;--card:#2a2d47;--ink:#f3f1ff;--soft:#3d4166;--bar:#3a3e5f}}
:root[data-theme="dark"]{--bg:#1e2033;--card:#2a2d47;--ink:#f3f1ff;--soft:#3d4166;--bar:#3a3e5f}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal","Segoe UI",Tahoma,sans-serif;font-size:18px}
.wrap{max-width:640px;margin:0 auto;padding:14px}
h1{margin:6px 0;text-align:center;font-size:26px;color:var(--pri)}
.sub{text-align:center;margin:0 0 10px;font-size:16px}
.top{display:flex;gap:10px;align-items:center;margin:10px 0}
.bar{flex:1;height:16px;background:var(--bar);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb703,var(--ok));transition:width .4s}
.score{font-weight:800;white-space:nowrap}
.hero{display:flex;gap:12px;align-items:center;background:var(--soft);border-radius:20px;padding:10px;margin-bottom:12px}
.pic{width:92px;height:92px;flex:none;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:54px;overflow:hidden;border:4px solid var(--pri);cursor:pointer}
#pic{display:contents}.pic img{width:100%;height:100%;object-fit:cover}
.say{flex:1;font-weight:700;line-height:1.5}
.say small{display:block;font-weight:500;opacity:.75;font-size:13px}
.card{background:var(--card);border-radius:20px;padding:18px;line-height:2.4;font-size:22px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.w{display:inline-block;padding:0 5px;border-radius:10px;cursor:pointer;transition:transform .15s}
.w:active{transform:scale(.92)}
.w.good{background:var(--ok);color:#fff}
.w.good small{display:block;font-size:13px;line-height:1.2;padding-bottom:4px}
.w.no{background:var(--bad);color:#fff;animation:sh .4s}
.w.hint{outline:3px dashed var(--pri)}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.btns{display:flex;gap:10px;margin-top:12px}
button{flex:1;font:inherit;font-weight:800;border:0;border-radius:16px;padding:12px;background:var(--pri);color:#fff;cursor:pointer}
button.alt{background:var(--soft);color:var(--ink)}
.msg{min-height:30px;text-align:center;font-weight:800;margin:10px 0}
.win{display:none;text-align:center;background:var(--card);border-radius:20px;padding:18px;margin-top:12px;font-size:22px;font-weight:800}
.win.on{display:block;animation:pop .5s}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.star{position:fixed;font-size:26px;pointer-events:none;animation:up 1s forwards}
@keyframes up{to{transform:translateY(-120px);opacity:0}}
</style>
<style>
:root{--bg:#e8f7ff;--card:#fffdf5;--ink:#3b2f63;--pri:#ff6fb1;--ok:#1fc76a;--bad:#ff5a5f;--soft:#fff0b8;--bar:#d9ecf7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d2350;--card:#2b3170;--ink:#fff8e1;--soft:#4a3f8f;--bar:#3a4390}}
:root[data-theme="dark"]{--bg:#1d2350;--card:#2b3170;--ink:#fff8e1;--soft:#4a3f8f;--bar:#3a4390}
body{background:var(--bg) radial-gradient(circle at 15% 8%,#ffe27a55 0 90px,transparent 91px),radial-gradient(circle at 90% 30%,#ff9fd355 0 70px,transparent 71px),radial-gradient(circle at 10% 80%,#8ee3b055 0 80px,transparent 81px) fixed}
h1{font-size:32px;color:#ff6fb1;text-shadow:2px 2px 0 #ffd23f,4px 4px 0 #5bc0ff55}
.sub{background:#ffd23f;color:#3b2f63;display:table;margin:0 auto 12px;padding:4px 16px;border-radius:99px;font-weight:800}
.banner{position:relative;border-radius:26px;overflow:hidden;border:5px solid #ffd23f;box-shadow:0 6px 0 #ff9f1c,0 10px 20px rgba(0,0,0,.15);margin-bottom:14px}
.banner img{display:block;width:100%;height:auto}
.bubble{position:absolute;inset:auto 8px 8px 8px;background:#fffdf5ee;color:#3b2f63;border-radius:18px;padding:8px 12px;font-weight:800;font-size:16px;text-align:center}
.bar{height:20px;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.bar i{background:linear-gradient(90deg,#ff6fb1,#ffd23f,#1fc76a,#5bc0ff)}
.score{background:#fff;color:#3b2f63;padding:2px 12px;border-radius:99px;border:3px solid #ffd23f}
.card{border:4px dashed #5bc0ff;font-size:23px;box-shadow:0 6px 0 #5bc0ff55}
.w:hover{background:#fff0b8;color:#3b2f63}
.w.good{background:linear-gradient(135deg,#1fc76a,#7be495)}
.w.no{background:#ff5a5f}
button{background:linear-gradient(180deg,#ff8fc4,#ff6fb1);box-shadow:0 4px 0 #d9468d;font-size:18px}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #d9468d}
button.alt{background:linear-gradient(180deg,#ffe27a,#ffc933);color:#3b2f63;box-shadow:0 4px 0 #d9a100}
#mute{background:linear-gradient(180deg,#8fe3ff,#4fc3f7);box-shadow:0 4px 0 #2a8fc0}
.win{border:4px solid #ffd23f;background:linear-gradient(135deg,#fff0b8,#ffd6ec);color:#3b2f63}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.tabs button{flex:1 1 28%;padding:8px 4px;font-size:16px}
.emo{display:none;height:200px;align-items:center;justify-content:center;font-size:56px;letter-spacing:8px}
.who{display:flex;gap:8px;margin-bottom:10px}.who input,.who select{font:inherit;font-weight:700;border:3px solid #5bc0ff;border-radius:14px;padding:8px 12px;background:#fff;color:#3b2f63}.who input{flex:1;min-width:0}
.cv{display:none;position:fixed;inset:0;z-index:50;background:rgba(40,30,80,.7);overflow:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 14px 14px}.cv.on{display:block}
.cert{max-width:520px;margin:0 auto;background:#fffdf5;color:#3b2f63;border:8px double #ff9f1c;border-radius:22px;padding:20px;text-align:center;font-weight:700;line-height:1.7;animation:pop .5s}
.c-top{font-size:28px;font-weight:800;color:#ff6fb1;text-shadow:2px 2px 0 #ffd23f}
.c-name{font-size:34px;font-weight:800;color:#1b8f55;margin:6px 0;border-bottom:3px dotted #ffd23f}
.c-lines{background:#e8f7ff;border-radius:14px;padding:6px;margin:10px 0}
.c-grade{font-size:30px;font-weight:800;color:#ff6fb1}.c-rate{font-size:22px}.c-date{opacity:.7;font-size:15px;margin-top:6px}
.c-btns{display:flex;gap:10px;margin-top:12px}.c-tip{font-size:14px;opacity:.7;margin-top:8px}
@media print{body *{visibility:hidden}.cv,.cv *{visibility:visible}.cv{position:absolute;background:#fff;overflow:visible}.nop{display:none!important}}.tabs button{opacity:.55;transform:scale(.97)}.tabs button.on{opacity:1;transform:none;background:linear-gradient(180deg,#9be28f,#1fc76a);box-shadow:0 4px 0 #0f9a4d}
</style>
</head>

    else s.textContent=tok;
    s.onclick=function(e){tap(s,e)};
    box.appendChild(s);box.appendChild(document.createTextNode(" "));
  });
  upd();
}
function upd(){
  document.getElementById("score").textContent="⭐ "+found+" / "+total;
  document.getElementById("fill").style.width=(total?found/total*100:0)+"%";
}
function stars(e){
  for(var i=0;i<5;i++){var d=document.createElement("div");d.className="star";d.textContent="⭐";
    d.style.left=(e.clientX-20+Math.random()*40)+"px";d.style.top=(e.clientY-10)+"px";
    document.body.appendChild(d);setTimeout(function(x){x.remove()},1000,d)}
}
function tap(s,e){
  if(s.classList.contains("good"))return;
  if(s.dataset.fix){
    s.className="w good";
    var old=s.textContent;
    s.textContent="";
    s.appendChild(document.createTextNode(old));
    var sm=document.createElement("small");sm.textContent="✔ "+s.dataset.fix+(s.dataset.tail||"");
    s.appendChild(sm);
    found++;upd();stars(e);cheer(found===total);
    document.getElementById("msg").textContent=["ممتاز! 🌟","رائع! 👏","صيدٌ ثمين! 🎯","أنت ذكي! 🧠"][found%4];
    if(found===total){res[lv]=Math.round(found/(found+wrong)*100);document.getElementById("win").classList.add("on")}
  }else{
    s.classList.remove("no");void s.offsetWidth;s.classList.add("no");
    document.getElementById("msg").textContent="هذه الكلمة صحيحة، حاول مرة أخرى 🙂";wrong++;buzz();
    setTimeout(function(){s.classList.remove("no")},600);
  }
}
var AC=null,muted=false,wrong=0,res={};
function ctx(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume()}catch(e){}return AC}
function tone(f,t,d,type,v){var c=ctx();if(!c||muted)return;var o=c.createOscillator(),g=c.createGain(),s=c.currentTime+t;
  o.type=type||"triangle";o.frequency.value=f;g.gain.setValueAtTime(0.0001,s);g.gain.exponentialRampToValueAtTime(v||0.25,s+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,s+d);o.connect(g);g.connect(c.destination);o.start(s);o.stop(s+d+0.05)}
function clap(n,vol){var c=ctx();if(!c||muted)return;
  for(var i=0;i<n;i++){var s=c.currentTime+0.25+i*(0.06+Math.random()*0.05),len=Math.floor(c.sampleRate*0.09),b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);
    for(var k=0;k<len;k++)d[k]=(Math.random()*2-1)*Math.pow(1-k/len,3);
    var src=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();src.buffer=b;f.type="bandpass";f.frequency.value=1400+Math.random()*1800;f.Q.value=0.7;
    g.gain.value=(vol||0.6)*(0.5+Math.random()*0.5);src.connect(f);f.connect(g);g.connect(c.destination);src.start(s)}}
function cheer(win){tone(660,0,0.15);tone(880,0.12,0.25);clap(win?60:14,win?0.9:0.6);
  if(win)[523,659,784,1047].forEach(function(f,i){tone(f,0.3+i*0.14,0.35,"triangle",0.3)})}
function buzz(){tone(180,0,0.18,"sawtooth",0.08)}
document.getElementById("mute").onclick=function(){muted=!muted;this.textContent=muted?"🔇":"🔊"};
document.getElementById("hint").onclick=function(){
  var w=box.querySelector(".w[data-fix]:not(.good)");
  if(!w)return;w.classList.add("hint");setTimeout(function(){w.classList.remove("hint")},1800);
};
document.getElementById("reset").onclick=build;
function showCert(){
  var nmEl=document.getElementById("nm"),nm=nmEl.value.trim();
  if(!nm){document.getElementById("msg").textContent="اكتب اسمك في الخانة أولًا ✏️";nmEl.focus();window.scrollTo(0,0);return}
  var f=document.getElementById("gd").value==="f",ks=Object.keys(res),sum=0,L=document.getElementById("c-lines");
  L.textContent="";
  ks.forEach(function(k){sum+=res[k];var d=document.createElement("div");d.textContent="المستوى "+(+k+1)+": "+res[k]+"%";L.appendChild(d)});
  var avg=ks.length?Math.round(sum/ks.length):0;
  document.getElementById("c-role").textContent=f?"الطالبة المتميزة":"الطالب المتميز";
  document.getElementById("c-who").textContent=nm;
  document.getElementById("c-txt").textContent=(f?"لتفوقها":"لتفوقه")+" في لعبة «صيّاد الأخطاء» (التاء المربوطة والتاء المفتوحة)";
  document.getElementById("c-grade").textContent="الدرجة: "+avg+"%";
  document.getElementById("c-rate").textContent=avg>=90?"ممتاز 🌟🌟🌟":avg>=70?"جيد جدًا 🌟🌟":"جيد 🌟 حاول مرة أخرى لتحصل على درجة أعلى";
  document.getElementById("c-date").textContent=new Date().toLocaleDateString("ar");
  document.getElementById("cv").classList.add("on");clap(30,0.8);
}
document.getElementById("cert").onclick=showCert;
document.getElementById("c-close").onclick=function(){document.getElementById("cv").classList.remove("on")};
document.getElementById("c-print").onclick=function(){try{window.print()}catch(e){}};
document.getElementById("next").onclick=function(){lv++;build();window.scrollTo(0,0)};
document.getElementById("file").onchange=function(ev){
  var f=ev.target.files[0];if(!f)return;
  var r=new FileReader();r.onload=function(){
    var p=document.getElementById("pic");
    p.textContent="";var im=document.createElement("img");im.src=r.result;p.appendChild(im);
  };r.readAsDataURL(f);
};
build();
</script>
